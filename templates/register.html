{% extends "base.html" %}

{% block title %}Register | AI Smart Lost & Found{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <!-- Icon -->

        <div class="auth-icon">
            📝
        </div>

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Join AI Smart Lost & Found
        </p>


        <!-- Registration Form -->

        <form method="POST" action="{{ url_for('register') }}">

            <div class="form-group">

                <label for="name">
                    👤 Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    📧 Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    📱 Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    🔑 Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%; margin-top:10px;"
            >
                🚀 Create Account
            </button>

        </form>


        <!-- Login -->

        <div class="auth-footer">

            <p>
                Already have an account?
            </p>

            <a
                href="{{ url_for('login') }}"
                class="btn btn-outline"
            >
                🔐 Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
