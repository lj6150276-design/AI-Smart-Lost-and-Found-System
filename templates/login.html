{% extends "base.html" %}

{% block title %}Login | AI Smart Lost & Found{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <!-- Logo / Icon -->

        <div class="auth-icon">
            🔐
        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to your AI Smart Lost & Found account
        </p>


        <!-- Login Form -->

        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">

                <label for="email">
                    📧 Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    🔑 Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%; margin-top:10px;"
            >
                🚀 Login
            </button>

        </form>


        <!-- Register -->

        <div class="auth-footer">

            <p>
                Don't have an account?
            </p>

            <a
                href="{{ url_for('register') }}"
                class="btn btn-outline"
            >
                Create New Account
            </a>

        </div>

    </div>

</div>

{% endblock %}
