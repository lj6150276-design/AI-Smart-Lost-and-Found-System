{% extends "base.html" %}

{% block title %}Report Found Item | AI Smart Lost & Found{% endblock %}

{% block content %}

<div class="page-header">
    <h1>🟢 Report Found Item</h1>
    <p>Help someone recover their lost item by reporting it here.</p>
</div>

<div class="form-card">

    <form action="{{ url_for('report_found') }}"
          method="POST"
          enctype="multipart/form-data">

        <div class="form-group">
            <label for="item_name">📦 Item Name</label>
            <input
                type="text"
                id="item_name"
                name="item_name"
                placeholder="e.g. Black Wallet"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">📂 Category</label>
            <select id="category" name="category" required>
                <option value="">Select Category</option>
                <option value="Mobile">📱 Mobile</option>
                <option value="Laptop">💻 Laptop</option>
                <option value="Wallet">👛 Wallet</option>
                <option value="Bag">🎒 Bag</option>
                <option value="Keys">🔑 Keys</option>
                <option value="Documents">📄 Documents</option>
                <option value="Watch">⌚ Watch</option>
                <option value="Jewellery">💍 Jewellery</option>
                <option value="Other">📦 Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">📍 Found Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="e.g. Kota Railway Station"
                required
            >
        </div>

        <div class="form-group">
            <label for="date_found">📅 Found Date</label>
            <input
                type="date"
                id="date_found"
                name="date_found"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">📝 Description</label>
            <textarea
                id="description"
                name="description"
                placeholder="Describe the found item..."
                required
            ></textarea>
        </div>

        <div class="form-group">
            <label for="image">📷 Item Image</label>
            <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
            >
        </div>

        <div style="
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            margin-top:25px;
        ">

            <button
                type="submit"
                class="btn btn-success"
            >
                🟢 Submit Found Report
            </button>

            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-secondary"
            >
                ← Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
